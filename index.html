<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>画像アップロード（ライブラリ/カメラ + 手動POST）</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;line-height:1.5;margin:0;padding:24px;background:#fafafa;color:#111}
    .card{background:#fff;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.06);padding:20px;margin:12px auto;max-width:780px}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    button{appearance:none;border:0;border-radius:12px;padding:14px 16px;font-size:16px;cursor:pointer;background:#111;color:#fff}
    button.secondary{background:#f0f0f0;color:#111}
    button:disabled{opacity:.5;cursor:not-allowed}
    .muted{color:#666}
    .label{display:inline-block;min-width:8em;color:#666}
    .line{margin:6px 0}
    .error{color:#b00020}
    .ok{color:#0a7f2e}
    .hidden{display:none !important}
    video{width:0;height:0}
    img.qr{width:280px;height:auto;display:block;margin:24px auto 0}
  </style>
</head>
<body>
  <div class="card">
    <h1>画像アップロード（ライブラリ/カメラ）</h1>
    <p class="muted">選んだ <strong>JPEG</strong> だけを <strong>POSTボタン</strong> を押した時に送信します。ライブラリは <code>capture</code> なしで開きます。</p>

    <div class="row" role="group" aria-label="入力方法">
      <!-- ライブラリ：capture を付けない -->
      <button id="pickFromLibrary" class="secondary">ライブラリから選ぶ</button>
      <input id="libraryInput" type="file" accept="image/jpeg" class="hidden" style="display:none">

      <!-- カメラ：独自実装（HTTPS必須） -->
      <button id="takePhoto">カメラで撮影（ブラウザ）</button>
      <video id="camPreview" autoplay playsinline muted></video>
    </div>

    <hr style="margin:16px 0">

    <div id="info">
      <div class="line"><span class="label">選択中ファイル：</span><span id="fileName">（未選択）</span></div>
      <div class="line"><span class="label">MIME：</span><span id="fileType">—</span></div>
      <div class="line"><span class="label">サイズ：</span><span id="fileSize">—</span></div>
    </div>

    <div class="row" style="margin-top:12px">
      <button id="postBtn" disabled>POST送信</button>
      <button id="clearBtn" class="secondary">クリア</button>
    </div>

    <p id="status" class="muted" style="margin-top:12px"></p>

    <!-- ✅ QRコードは残します（iPhone でのアクセス導線用） -->
    <img class="qr" src="./QR_942906.png" alt="QRコード">
  </div>

  <script type="module">
    // ===== 設定 =====
    const ENDPOINT = "https://ik1-127-70116.vs.sakura.ne.jp/markAnomaly"; // 送信先
    const FIELD_NAME = "image";                                           // FormData のフィールド名
    const REQUIRE_JPEG_ONLY = true;                                       // JPEGのみ送信

    // ===== 要素参照 =====
    const pickBtn   = document.getElementById('pickFromLibrary');
    const fileInput = document.getElementById('libraryInput');
    const camBtn    = document.getElementById('takePhoto');
    const videoEl   = document.getElementById('camPreview');
    const postBtn   = document.getElementById('postBtn');
    const clearBtn  = document.getElementById('clearBtn');
    const fileNameEl= document.getElementById('fileName');
    const fileTypeEl= document.getElementById('fileType');
    const fileSizeEl= document.getElementById('fileSize');
    const statusEl  = document.getElementById('status');

    // ===== 状態 =====
    /** @type {File|null} */
    let currentFile = null;

    // ===== ユーティリティ =====
    function setStatus(msg, type='') {
      statusEl.className = type ? type : 'muted';
      statusEl.textContent = msg;
    }
    function bytes(n){ return (n==null)?'—': (n<1024? `${n} B` : n<1024*1024? `${(n/1024).toFixed(1)} KB` : `${(n/1024/1024).toFixed(2)} MB`); }
    function pad(n){ return String(n).padStart(2,'0'); }
    function yyyymmddhhmmss(d=new Date()){
      return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
    }
    function stopStream(){
      try{ const s = videoEl.srcObject; if(s) s.getTracks().forEach(t=>t.stop()); videoEl.srcObject=null; }catch{}
    }
    function showFileInfo(file){
      fileNameEl.textContent = file?.name ?? '（未選択）';
      fileTypeEl.textContent = file?.type ?? '—';
      fileSizeEl.textContent = file ? bytes(file.size) : '—';
      postBtn.disabled = !file;
    }
    function requireJPEG(file){
      if (!REQUIRE_JPEG_ONLY) return true;
      const ok = /^image\/jpeg$/i.test(file.type);
      if (!ok) setStatus('❌ JPEG以外は送信できません（HEIC/PNGは不可）。JPEGを選択/撮影してください。', 'error');
      return ok;
    }

    // ===== ライブラリから選ぶ（captureなし） =====
    pickBtn.addEventListener('click', () => {
      fileInput.value = ''; // 同じ選択も拾えるように
      fileInput.click();
    });
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) { setStatus('選択がキャンセルされました。'); return; }
      if (!requireJPEG(file)) { currentFile = null; showFileInfo(null); return; }
      currentFile = file;
      showFileInfo(currentFile);
      setStatus('ライブラリからJPEGを選択しました。POSTボタンで送信できます。', 'ok');
    });

    // ===== カメラ撮影（独自実装） =====
    camBtn.addEventListener('click', async () => {
      setStatus('カメラ起動中…（HTTPS必須）');
      if (!navigator.mediaDevices?.getUserMedia) {
        setStatus('❌ このブラウザはカメラAPIに未対応です。', 'error'); return;
      }
      if (typeof ImageCapture === 'undefined') {
        setStatus('❌ ImageCapture.takePhoto() に未対応です（Safari 18.4+ 推奨）。', 'error'); return;
      }
      stopStream();
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal:'environment' } }, audio:false });
        videoEl.srcObject = stream;
        const [track] = stream.getVideoTracks();
        const ic = new ImageCapture(track);
        setStatus('撮影中…');
        const blob = await ic.takePhoto(); // 端末設定により HEIC or JPEG

        stopStream();

        // HEICの可能性あり → 今回はJPEG限定運用のため、HEICなら弾く
        const type = blob.type || 'application/octet-stream';
        if (!/^image\/jpeg$/i.test(type)) {
          currentFile = null;
          showFileInfo(null);
          setStatus('❌ この端末はHEICで撮影されています。iOSの「設定→カメラ→フォーマット」で互換性優先（JPEG）に変更してください。', 'error');
          return;
        }

        // 撮影結果を現在時刻のYYYYMMDDhhmmss.jpgで命名
        const name = `${yyyymmddhhmmss()}.jpg`;
        const file = new File([blob], name, { type: 'image/jpeg' });

        currentFile = file;
        showFileInfo(currentFile);
        setStatus('カメラでJPEGを取得しました。POSTボタンで送信できます。', 'ok');
      } catch (err) {
        stopStream();
        setStatus(`撮影エラー: ${err?.message || err}`, 'error');
      }
    });

    // ===== POST送信（手動のみ） =====
    postBtn.addEventListener('click', async () => {
      if (!currentFile) { setStatus('送信するファイルがありません。', 'error'); return; }
      if (!requireJPEG(currentFile)) return;

      setStatus('送信中…（ネットワーク/CORS設定に依存）');
      postBtn.disabled = true;
      try {
        const fd = new FormData();
        fd.append(FIELD_NAME, currentFile, currentFile.name);
        const res = await fetch(ENDPOINT, { method: 'POST', body: fd /* CORS要注意 */ });
        const text = await res.text().catch(()=> '');
        if (res.ok) {
          setStatus(`✅ 送信成功: ${res.status} ${res.statusText} / 応答: ${text.slice(0,200)}`, 'ok');
        } else {
          setStatus(`❌ 送信失敗: HTTP ${res.status} / 応答: ${text.slice(0,200)}`, 'error');
        }
      } catch (err) {
        setStatus(`❌ 通信エラー（CORS/ネットワーク）: ${err?.message || err}`, 'error');
      } finally {
        postBtn.disabled = !currentFile;
      }
    });

    // ===== クリア =====
    clearBtn.addEventListener('click', () => {
      currentFile = null;
      fileInput.value = '';
      showFileInfo(null);
      setStatus('クリアしました。');
      stopStream();
    });

    // 初期表示
    showFileInfo(null);
    setStatus('ライブラリから選ぶ、またはカメラで撮影してください。');
  </script>
</body>
</html>
