<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <link rel="manifest" href="./manifest.webmanifest">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Photo Library Uploader</title>
</head>
<body>
<button id="pick">写真ライブラリから選ぶ</button>
<div id="guide" hidden>
    <p>初回はショートカットを追加してください。</p>
    <a id="shortcut-link" href="https://www.icloud.com/shortcuts/3a350e15a025402d80d1ff7ffac18853" target="_blank" rel="noopener noreferrer">ショートカットを追加</a>
</div>


<!-- 追加ここから -->
<img src="./QR_942906.png" alt="QRコード" style="width:300px;height:auto;display:block;margin:40px auto;">
<!-- 追加ここまで -->

<script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js');

    const btn = document.getElementById('pick'), guide = document.getElementById('guide');
    const shortcutLink = document.getElementById('shortcut-link');
    const SHORTCUT_URL = 'https://www.icloud.com/shortcuts/3a350e15a025402d80d1ff7ffac18853';
    shortcutLink.href = SHORTCUT_URL;
    const url = new URL(location.href);
    if (url.searchParams.get('ok') === '1') { history.replaceState(null, '', location.pathname); alert('アップロード処理を受け付けました。'); }

    btn.addEventListener('click', () => {
        const back = encodeURIComponent(`${location.origin}${location.pathname}?ok=1`);
        const t = Date.now();
        location.href = `shortcuts://run-shortcut?name=%E6%92%AE%E5%BD%B1%E7%94%BB%E5%83%8F%E3%81%AE%E9%81%B8%E6%8A%9E&x-success=${back}`;
        setTimeout(() => { if (Date.now() - t > 7000 && location.search.indexOf('ok=1') === -1) guide.hidden = false; }, 7000);
    });
</script>

</body>
</html>
