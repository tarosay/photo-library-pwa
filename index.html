<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photo Library Uploader</title>
<button id="pick">写真ライブラリから選ぶ</button>
<div id="guide" hidden>
    <p>初回はショートカットを追加してください。</p>
    <a href="https://www.icloud.com/shortcuts/XXXXXXXX" target="_blank" rel="noopener">ショートカットを追加</a>
</div>

<!-- 画像選択ショートカットの入手リンク -->
<section style="max-width:680px;margin:24px auto;padding:16px;border:1px solid #e5e5e5;border-radius:12px;background:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <h2 style="margin:0 0 8px;font-size:18px">画像選択ショートカットを入手してください</h2>
  <p style="margin:0 0 12px;color:#555;line-height:1.6">
    下のボタンをタップすると、ショートカットの追加画面が開きます。追加後、このページに戻ってご利用ください。
  </p>
  <a href="https://www.icloud.com/shortcuts/9f51ea0b42804f32a4c847200e94a693"
     target="_blank" rel="noopener"
     style="display:inline-block;text-decoration:none;padding:12px 16px;border-radius:10px;background:#0b57d0;color:#fff;font-weight:600">
    画像選択ショートカットを追加する
  </a>
  <p style="margin:12px 0 0;color:#777;font-size:13px;line-height:1.5">
    ※ iPhoneの「ショートカット」アプリが起動します。内容を確認して「ショートカットを追加」を押してください。
  </p>
</section>


<!-- 追加ここから -->
<img src="./QR_942906.png" alt="QRコード" style="width:300px;height:auto;display:block;margin:40px auto;">
<!-- 追加ここまで -->

<script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js');

    const btn = document.getElementById('pick'), guide = document.getElementById('guide');
    const url = new URL(location.href);
    if (url.searchParams.get('ok') === '1') { history.replaceState(null, '', location.pathname); alert('アップロード処理を受け付けました。'); }

    btn.addEventListener('click', () => {
        const back = encodeURIComponent(`${location.origin}${location.pathname}?ok=1`);
        const t = Date.now();
        location.href = `shortcuts://run-shortcut?name=SelectPhoto&x-success=${back}`;
        setTimeout(() => { if (Date.now() - t > 7000 && location.search.indexOf('ok=1') === -1) guide.hidden = false; }, 7000);
    });
</script>

</html>
