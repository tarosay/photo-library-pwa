<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Camera EXIF チェッカー（保存改善版）</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;line-height:1.5;margin:0;padding:24px;background:#fafafa;color:#111}
    h1{font-size:20px;margin:0 0 12px}
    .card{background:#fff;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.06);padding:20px;margin:12px auto;max-width:780px}
    button{appearance:none;border:0;border-radius:12px;padding:14px 16px;font-size:16px;cursor:pointer;background:#111;color:#fff}
    .muted{color:#666}
    img.qr{width:280px;height:auto;display:block;margin:24px auto 0}
    a.btn{display:inline-block;margin-top:10px}
    .hidden{display:none !important}
    pre{background:#f6f6f6;border-radius:10px;padding:10px;overflow:auto}
  </style>
</head>
<body>
  <div class="card">
    <h1>カメラ撮影 → EXIF確認 & 保存</h1>
    <p class="muted">Safari 18.4+ 推奨。撮影後、まず共有シートで保存を試み、不可ならダウンロードリンクを表示します。</p>

    <button id="takePhoto">カメラで撮影</button>
    <video id="camPreview" autoplay playsinline muted style="width:0;height:0"></video>
    <p class="muted" id="status"></p>

    <details>
      <summary>EXIF 検出結果</summary>
      <pre id="exifDump">{}</pre>
    </details>

    <!-- 共有不可・自動DL不可の時に表示する手動保存リンク -->
    <a id="manualSave" class="btn hidden" download="photo.jpg">ここをタップして保存</a>

    <!-- ✅ QRコードはそのまま -->
    <img class="qr" src="./QR_942906.png" alt="QRコード">
  </div>

  <!-- EXIF書き戻し用（UMD） -->
  <script src="https://cdn.jsdelivr.net/npm/piexifjs"></script>

  <script type="module">
    import exifr from 'https://cdn.jsdelivr.net/npm/exifr/dist/full.esm.js';

    const takeBtn   = document.getElementById('takePhoto');
    const videoEl   = document.getElementById('camPreview');
    const statusEl  = document.getElementById('status');
    const exifDump  = document.getElementById('exifDump');
    const manualA   = document.getElementById('manualSave');

    function stopStream(){
      try {
        const s = videoEl.srcObject;
        if (s) s.getTracks().forEach(t => t.stop());
        videoEl.srcObject = null;
      } catch {}
    }

    function dataURLtoBlob(dataURL){
      const [header, data] = dataURL.split(',');
      const mime = header.match(/data:(.*?);base64/)[1];
      const bin  = atob(data);
      const buf  = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
      return new Blob([buf], {type: mime});
    }

    function toRational(num){
      if (typeof num !== 'number' || !isFinite(num)) return undefined;
      const d = 10000; return [Math.round(num * d), d];
    }
    function toExposureRational(sec){
      if (typeof sec !== 'number' || sec <= 0) return undefined;
      const d = Math.max(1, Math.round(1/sec)); return [1, d];
    }
    function formatExifDate(dt){
      const d = (dt instanceof Date) ? dt : (dt ? new Date(dt) : null);
      if (!d || isNaN(d.getTime())) return undefined;
      const pad = n => String(n).padStart(2,'0');
      return `${d.getFullYear()}:${pad(d.getMonth()+1)}:${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    async function heicToJpegWithExif(heicBlob, tags){
      const bmp   = await createImageBitmap(heicBlob);
      const cvs   = document.createElement('canvas');
      cvs.width   = bmp.width;
      cvs.height  = bmp.height;
      cvs.getContext('2d').drawImage(bmp, 0, 0);
      const quality = 0.92;
      const jpegDataURL = cvs.toDataURL('image/jpeg', quality);

      const zeroth = {};
      const exifIFD = {};
      const gpsIFD = {};

      if (tags?.Make)  zeroth[piexif.ImageIFD.Make]  = String(tags.Make);
      if (tags?.Model) zeroth[piexif.ImageIFD.Model] = String(tags.Model);
      zeroth[piexif.ImageIFD.Orientation] = 1;

      const dto = formatExifDate(tags?.DateTimeOriginal || tags?.CreateDate || tags?.ModifyDate);
      if (dto) exifIFD[piexif.ExifIFD.DateTimeOriginal] = dto;

      const iso = tags?.ISO ?? tags?.PhotographicSensitivity;
      if (typeof iso === 'number') exifIFD[piexif.ExifIFD.ISOSpeedRatings] = iso;
      if (typeof tags?.FNumber === 'number') exifIFD[piexif.ExifIFD.FNumber] = toRational(tags.FNumber);
      if (typeof tags?.ExposureTime === 'number') exifIFD[piexif.ExifIFD.ExposureTime] = toExposureRational(tags.ExposureTime);
      if (typeof tags?.FocalLength === 'number') exifIFD[piexif.ExifIFD.FocalLength] = toRational(tags.FocalLength);
      if (tags?.LensModel) exifIFD[piexif.ExifIFD.LensModel] = String(tags.LensModel);

      if (tags?.latitude && tags?.longitude) {
        const toGPS = (v)=> {
          const deg = Math.floor(v);
          const minF = (v - deg) * 60;
          const min = Math.floor(minF);
          const sec = (minF - min) * 60;
          const R = n => [Math.round(n*10000), 10000];
          return [R(Math.abs(deg)), R(Math.abs(min)), R(Math.abs(sec))];
        };
        gpsIFD[piexif.GPSIFD.GPSLatitudeRef]  = tags.latitude  >= 0 ? 'N' : 'S';
        gpsIFD[piexif.GPSIFD.GPSLongitudeRef] = tags.longitude >= 0 ? 'E' : 'W';
        gpsIFD[piexif.GPSIFD.GPSLatitude]  = toGPS(tags.latitude);
        gpsIFD[piexif.GPSIFD.GPSLongitude] = toGPS(tags.longitude);
      }

      const exifBytes = piexif.dump({ "0th": zeroth, "Exif": exifIFD, "GPS": gpsIFD });
      const withExifDataURL = piexif.insert(exifBytes, jpegDataURL);
      return dataURLtoBlob(withExifDataURL);
    }

    async function saveFilePreferShare(blob, filename){
      // 1) 共有シート（iOS Safariで “写真に保存 / ファイルに保存” が選べる）
      try {
        const file = new File([blob], filename, { type: blob.type || 'image/jpeg' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'Photo', text: '保存先を選んでください' });
          statusEl.textContent = '共有シートから保存しました。';
          return true;
        }
      } catch (e) {
        console.log('share error', e);
      }

      // 2) フォールバック: ダウンロードリンクを生成して画面に表示（自動クリックは避ける）
      const url = URL.createObjectURL(blob);
      manualA.href = url;
      manualA.download = filename;
      manualA.classList.remove('hidden');
      statusEl.textContent = '「ここをタップして保存」リンクから保存してください。';
      // URL.revokeObjectURL はユーザー保存後で。ここでは解除しないでおく。
      return false;
    }

    async function handleShot(){
      manualA.classList.add('hidden');
      manualA.removeAttribute('href');

      if (!('mediaDevices' in navigator) || !navigator.mediaDevices.getUserMedia) {
        statusEl.textContent = '❌ このブラウザはカメラAPIに未対応です。';
        return;
      }
      if (typeof ImageCapture === 'undefined') {
        statusEl.textContent = '❌ ImageCapture.takePhoto() に未対応です。Safari 18.4+ が必要です。';
        return;
      }

      statusEl.textContent = 'カメラ起動中…（HTTPS必須）';
      stopStream();

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } }, audio: false
        });
        videoEl.srcObject = stream;

        const [track] = stream.getVideoTracks();
        const ic = new ImageCapture(track);

        statusEl.textContent = '撮影中…';
        const srcBlob = await ic.takePhoto();

        const mime = srcBlob.type || '(不明)';
        const tags = await exifr.parse(srcBlob, [
          'ISO','PhotographicSensitivity','FNumber','ExposureTime',
          'Make','Model','LensModel','FocalLength',
          'DateTimeOriginal','CreateDate','ModifyDate',
          'latitude','longitude'
        ]);
        exifDump.textContent = JSON.stringify(tags || {}, null, 2);

        let outBlob;
        if (/image\/heic|image\/heif/i.test(mime)) {
          statusEl.textContent = 'HEIC → JPEG へ変換中（EXIF書き戻し）…';
          outBlob = await heicToJpegWithExif(srcBlob, tags);
        } else if (/image\/jpeg/i.test(mime)) {
          // そのまま保存
          outBlob = srcBlob;
        } else {
          statusEl.textContent = `想定外の形式(${mime}) → JPEG再エンコード（EXIF最小限）…`;
          outBlob = await heicToJpegWithExif(srcBlob, tags);
        }

        const ok = await saveFilePreferShare(outBlob, `photo-${Date.now()}.jpg`);
        if (ok) {
          const iso = tags?.ISO ?? tags?.PhotographicSensitivity ?? null;
          const f   = tags?.FNumber ?? null;
          const t   = tags?.ExposureTime ?? null;
          const tStr = (typeof t === 'number' && t>0)
            ? ( (1/ t)>=2 ? `1/${Math.round(1/t)} (${t})` : `${t}` )
            : (typeof t === 'string' ? t : '—');
          statusEl.textContent = `完了 ✅ / EXIF: ISO=${iso ?? '—'} / F=${f ?? '—'} / シャッター=${tStr}`;
        } else {
          // 手動リンクを表示済み
        }
      } catch (err) {
        console.error(err);
        statusEl.textContent = `エラー: ${err?.message || err}`;
      } finally {
        stopStream();
      }
    }

    takeBtn.addEventListener('click', handleShot);
  </script>
</body>
</html>
