<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Photo Capture (EXIF確認)</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;line-height:1.5;margin:0;padding:24px;background:#fafafa;color:#111}
    .card{background:#fff;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.06);padding:20px;margin:12px auto;max-width:700px}
    button{appearance:none;border:0;border-radius:12px;padding:14px 16px;font-size:16px;cursor:pointer;background:#111;color:#fff}
    small{color:#666}
  </style>
</head>
<body>
  <div class="card">
    <h1>ブラウザで撮影してEXIFを確認</h1>
    <p class="muted">ISO・F値・シャッタースピードがEXIFに含まれているかチェックします。</p>

    <button id="takePhoto">カメラで撮影</button>
    <video id="camPreview" class="hidden" autoplay playsinline muted style="width:0;height:0"></video>
    <div><small id="status" class="muted"></small></div>
  </div>

  <script type="module">
    import * as exifr from 'https://cdn.jsdelivr.net/npm/exifr/dist/lite.esm.js';

    const takeBtn  = document.getElementById('takePhoto');
    const videoEl  = document.getElementById('camPreview');
    const statusEl = document.getElementById('status');

    function stopStream() {
      try {
        const s = videoEl.srcObject;
        if (s) s.getTracks().forEach(t => t.stop());
        videoEl.srcObject = null;
      } catch {}
    }

    takeBtn.addEventListener('click', async () => {
      if (!('mediaDevices' in navigator) || !navigator.mediaDevices.getUserMedia) {
        statusEl.textContent = 'このブラウザはカメラAPIに未対応です。';
        return;
      }
      if (typeof ImageCapture === 'undefined') {
        statusEl.textContent = 'ImageCapture.takePhoto() に未対応のため撮影できません。Safari 18.4+ が必要です。';
        return;
      }

      statusEl.textContent = 'カメラ起動中…（ユーザー操作起点・HTTPS必須）';
      stopStream();

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        videoEl.srcObject = stream;

        const [track] = stream.getVideoTracks();
        const ic = new ImageCapture(track);

        statusEl.textContent = '撮影中…';
        const blob = await ic.takePhoto();   // ← ここが撮影箇所

        const tags = await exifr.parse(blob, ['ISO','PhotographicSensitivity','FNumber','ExposureTime']);
        const iso = tags?.ISO ?? tags?.PhotographicSensitivity ?? null;
        const f   = tags?.FNumber ?? null;
        const t   = tags?.ExposureTime ?? null;

        let tStr = '—';
        if (typeof t === 'number' && t > 0) {
          const denom = Math.round(1 / t);
          tStr = (denom >= 2) ? `1/${denom} (${t})` : `${t}`;
        } else if (typeof t === 'string') {
          tStr = t;
        }

        if (iso || f || t) {
          statusEl.textContent = `✅ EXIFあり：ISO=${iso ?? '—'} / F=${f ?? '—'} / シャッター=${tStr}`;
        } else {
          statusEl.textContent = '❌ EXIFに ISO・F値・シャッタースピード が見つかりませんでした。';
        }
      } catch (err) {
        statusEl.textContent = `撮影エラー: ${err?.message || err}`;
      } finally {
        stopStream();
      }
    });
  </script>
</body>
</html>
